services:

  api:
    # Pin a release with IMAGE_TAG (e.g. IMAGE_TAG=v1.2.3) instead of latest
    image: dcruz04/waitlistgo:${IMAGE_TAG:-latest}
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - waitlist_data:/app/data
    restart: unless-stopped
    healthcheck:
      # python is always present in the runtime image; curl is not
      test: ["CMD", "python", "-c", "import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/health', timeout=5); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL — only activated with --profile postgres
  db:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: openwaitlist
      POSTGRES_USER: openwaitlist
      # Set POSTGRES_PASSWORD in your .env — the app's DATABASE_URL must use
      # the same password. Only enforced when running with --profile postgres.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-db-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwaitlist"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  waitlist_data:
  postgres_data:
